<!doctype html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
        <title>Fenix | Parceiro oficial Cegid Primavera em Moçambique</title>
        <meta
            name="description"
            content="Implementamos soluções de gestão Cegid Primavera em Moçambique, do diagnóstico ao suporte."
        />

        <!-- Fonts: placeholders until the Canva fonts are confirmed (see tokens.css) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />

        <!-- Set the theme before React loads, so dark-mode users never see a white flash -->
        <script>
            (function () {
                var theme = "light";
                try {
                    var saved = localStorage.getItem("fenix-theme");
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                        theme = "dark";
                    }
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
